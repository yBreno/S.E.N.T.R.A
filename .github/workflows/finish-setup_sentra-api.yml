name: Build and deploy S.E.N.T.R.A. API

on:
  push:
    branches:
      - finish-setup
    paths:
      - "backend/**"
      - ".github/workflows/finish-setup_sentra-api.yml"

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show deployed commit
        run: git rev-parse HEAD

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore dependencies
        run: dotnet restore backend/Api/Api.csproj

      - name: Build API
        run: dotnet build backend/Api/Api.csproj --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish backend/Api/Api.csproj --configuration Release --no-restore --output "${{ runner.temp }}/sentra-api"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentra-api
          path: ${{ runner.temp }}/sentra-api

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: sentra-api
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A675758DC5F34DA292310738D8F25296 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_72B31B8F6CEA40368C2D41D6DE1D8CB4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_74ECA71096924530BC85011EF2E91653 }}

      - name: Deploy S.E.N.T.R.A. API
        uses: azure/webapps-deploy@v3
        with:
          app-name: sentra-api
          slot-name: Production
          package: ./publish
