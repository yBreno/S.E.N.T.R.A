name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/azure-static-web-apps-agreeable-desert-08bba710f.yml'

concurrency:
  group: sentra-frontend-production
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    # Liberar somente após conferir a nova API com schema e autenticação versionada.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SENTRA_USERS_API_VERSION == '20261024223405_AddUserAdministration' && vars.SENTRA_PASSWORD_RECOVERY_API_VERSION == '20261024234039_AddPasswordRecovery'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_BASE_URL: https://sentra-api-ftgqggbgbsbffqb0.northcentralus-01.azurewebsites.net
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_DESERT_08BBA710F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          production_branch: "main"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./frontend" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
