name: Build and deploy S.E.N.T.R.A. API

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/main_sentra-api.yml"

  workflow_dispatch:

concurrency:
  group: sentra-api-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show deployed commit
        run: git rev-parse HEAD

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore dependencies
        run: dotnet restore backend/Api/Api.csproj

      - name: Build API
        run: dotnet build backend/Api/Api.csproj --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish backend/Api/Api.csproj --configuration Release --no-restore --output "${{ runner.temp }}/sentra-api"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentra-api
          path: ${{ runner.temp }}/sentra-api
          if-no-files-found: error

  deploy:
    # Liberar a variável somente após aplicar e conferir a migration no banco de destino.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.SENTRA_USERS_SCHEMA_VERSION == '20261024223405_AddUserAdministration' && vars.SENTRA_PASSWORD_RECOVERY_SCHEMA_VERSION == '20261024234039_AddPasswordRecovery'
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: sentra-api
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4E887C9132FB45DA8CEAFE24161A18D8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5E125A0A3DDC442BBB4C139C1D271CD6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C9F9153099B54783BEE01FE987DCA04B }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: sentra-api
          slot-name: Production
          package: ./publish
